# 화면 테마 (시인성 설정)
# =====================================
# 코드를 고치지 않고 앱 전체의 글자 크기·색·테두리를 한 번에 정하는 파일이다.
# 이 파일을 지우면 Streamlit 기본 모양으로 완전히 되돌아간다.
#
# 주의: base 를 "light" 로 고정한 이유
#   app.py 의 '탭 막대 상단 고정' CSS 가 배경색(#FFFFFF)을 직접 적어 쓴다.
#   Streamlit 이 CSS 변수로 배경색을 내주지 않아서인데, 그래서 다크모드로 보면
#   흰 막대만 떠 보이게 된다. 라이트로 고정해 누가 어디서 보든 같은 화면이 되게 한다.
#   backgroundColor 를 바꾸면 app.py 의 그 CSS 값도 같이 바꿔야 한다.

[theme]
base = "light"

# 기본 16 → 17. 표·카드가 많은 화면이라 한 단계만 올린다(18은 점수 10칸이 줄바꿈됨).
baseFontSize = 17

# 기본 #31333F 는 회색빛이라 대비가 약하다. 더 진하게.
textColor = "#16202B"
backgroundColor = "#FFFFFF"

# 사이드바·표 머리글 등 본문과 구분돼야 하는 면
secondaryBackgroundColor = "#F2F5F9"

# 입력칸·선택상자에 테두리를 그려 구획이 보이게 한다
borderColor = "#D6DEE8"
showWidgetBorder = true
baseRadius = "medium"

# 표 머리글이 본문 행과 섞이지 않게
dataframeHeaderBackgroundColor = "#E8EEF6"

# primaryColor(강조 빨강)는 일부러 두었다. 흰 바탕에서 대비가 이미 충분하고,
# 바꾸면 저장 버튼·탭 밑줄 색이 전부 달라져 '시인성 개선'을 넘는 변화가 된다.
